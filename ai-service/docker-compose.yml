version: "3.9"

services:
  ai-link-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev  # dev
    container_name: ai-link-service
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - .:/app  #Prod thì bỏ đi
    networks:
      - social.net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # reload để dev nhanh hơn

networks:
  social.net:
    external: true
